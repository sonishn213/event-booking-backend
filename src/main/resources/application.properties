spring.application.name=eventticket
spring.main.banner-mode=off

# Database Connection
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Jwt
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL}

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Razorpay
razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET}

# KeyCloak
keycloak.admin.server_url=${KEYCLOAK_BASE_URL}
keycloak.admin.realm=${KEYCLOAK_REALM}
keycloak.admin.client_id=${KEYCLOAK_CLIENT_ID}
keycloak.admin.username=${KEYCLOAK_USERNAME}
keycloak.admin.password=${KEYCLOAK_PASSWORD}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
